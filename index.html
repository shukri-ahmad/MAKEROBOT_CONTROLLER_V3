<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Makerobot Pro Controller</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e24;
            --primary: #00d2ff;
            --danger: #ff0055;
            --text: #ffffff;
            --btn-bg: #2a2a35;
            --btn-shadow: #000000;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: var(--panel-color);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            color: var(--primary);
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.3);
        }

        .controls { display: flex; align-items: center; gap: 15px; }
        
        #status { font-size: 0.9rem; color: #888; display: flex; align-items: center; gap: 5px; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background-color: #888; }
        .status-dot.connected { background-color: #00ff88; box-shadow: 0 0 8px #00ff88; }

        .btn-connect {
            background: transparent; color: var(--primary); border: 2px solid var(--primary);
            padding: 8px 15px; border-radius: 20px; font-weight: bold; cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-connect:active { background: var(--primary); color: #000; }

        main { flex: 1; display: flex; justify-content: space-between; align-items: center; padding: 20px 40px; }

        .d-pad { display: grid; grid-template-columns: repeat(3, 70px); grid-template-rows: repeat(3, 70px); gap: 10px; }
        
        .d-pad button {
            background-color: var(--btn-bg); border: none; border-radius: 15px; color: white;
            font-size: 1.5rem; box-shadow: 0 6px 0 var(--btn-shadow), 0 10px 15px rgba(0,0,0,0.5);
            transition: all 0.1s;
        }
        
        .d-pad button:active, .d-pad button.active {
            transform: translateY(6px); box-shadow: 0 0 0 var(--btn-shadow), 0 0 15px var(--primary);
            background-color: var(--primary); color: black;
        }

        .up { grid-column: 2; grid-row: 1; border-radius: 15px 15px 5px 5px !important; }
        .left { grid-column: 1; grid-row: 2; border-radius: 15px 5px 5px 15px !important; }
        .right { grid-column: 3; grid-row: 2; border-radius: 5px 15px 15px 5px !important; }
        .down { grid-column: 2; grid-row: 3; border-radius: 5px 5px 15px 15px !important; }
        
        .stop { 
            grid-column: 2; grid-row: 2; border-radius: 50% !important; 
            background: var(--danger) !important; font-size: 1rem !important;
        }
        .stop:active, .stop.active { box-shadow: 0 0 0 var(--btn-shadow), 0 0 15px var(--danger) !important; }

        .action-pad {
            display: grid; grid-template-columns: repeat(3, 60px); grid-template-rows: repeat(3, 60px);
            gap: 15px; transform: rotate(45deg);
        }
        .action-pad button {
            background-color: var(--btn-bg); border: 2px solid #444; border-radius: 50%; color: white;
            font-size: 1.2rem; font-weight: bold; box-shadow: inset 0 -4px 0 rgba(0,0,0,0.5), 0 5px 10px rgba(0,0,0,0.5);
            transform: rotate(-45deg);
            transition: all 0.1s;
        }
        .action-pad button:active, .action-pad button.active {
            transform: rotate(-45deg) scale(0.9); box-shadow: inset 0 0 0 rgba(0,0,0,0.5), 0 0 15px var(--primary);
            border-color: var(--primary);
        }

        .btn-4 { grid-column: 1; grid-row: 1; }
        .btn-3 { grid-column: 2; grid-row: 2; }
        .btn-1 { grid-column: 1; grid-row: 2; }
        .btn-2 { grid-column: 2; grid-row: 1; }

        @media screen and (orientation: portrait) {
            main { flex-direction: column; justify-content: center; gap: 50px; }
            .action-pad { margin-top: 20px; }
        }
    </style>
</head>
<body>

    <header>
        <h1>MAKEROBOT PRO</h1>
        <div class="controls">
            <span id="status"><div class="status-dot" id="dot"></div> <span id="statusText">Disconnected</span></span>
            <button id="connectBtn" class="btn-connect">Connect</button>
        </div>
    </header>

    <main id="gamepadArea">
        <div class="d-pad">
            <button class="cmd-btn up" data-cmd="F" title="W or Up Arrow">▲</button>
            <button class="cmd-btn left" data-cmd="L" title="A or Left Arrow">◀</button>
            <button class="cmd-btn stop" data-cmd="S">STOP</button>
            <button class="cmd-btn right" data-cmd="R" title="D or Right Arrow">▶</button>
            <button class="cmd-btn down" data-cmd="B" title="S or Down Arrow">▼</button>
        </div>

        <div class="action-pad">
            <button class="cmd-btn btn-4" data-cmd="4" title="Key: 4">4</button>
            <button class="cmd-btn btn-2" data-cmd="2" title="Key: 2">2</button>
            <button class="cmd-btn btn-1" data-cmd="1" title="Key: 1">1</button>
            <button class="cmd-btn btn-3" data-cmd="3" title="Key: 3">3</button>
        </div>
    </main>

    <script>
        const UART_SERVICE_UUID = "6e400001-b5a3-f393-e0a9-e50e24dcca9e";
        const UART_RX_CHAR_UUID = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";

        let bluetoothDevice;
        let txCharacteristic;

        const connectBtn = document.getElementById('connectBtn');
        const statusText = document.getElementById('statusText');
        const dot = document.getElementById('dot');

        connectBtn.addEventListener('click', async () => {
            if (bluetoothDevice && bluetoothDevice.gatt.connected) {
                bluetoothDevice.gatt.disconnect();
                return;
            }

            try {
                statusText.innerText = "Connecting...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ namePrefix: 'BBC micro:bit' }, { namePrefix: 'Makerobot' }],
                    optionalServices: [UART_SERVICE_UUID]
                });

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    statusText.innerText = "Disconnected";
                    dot.classList.remove('connected');
                    connectBtn.innerText = "Connect";
                    txCharacteristic = null;
                });

                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(UART_SERVICE_UUID);
                txCharacteristic = await service.getCharacteristic(UART_RX_CHAR_UUID);

                statusText.innerText = "Connected";
                dot.classList.add('connected');
                connectBtn.innerText = "Disconnect";
                
                document.body.focus(); 

            } catch (error) {
                console.error("Connection failed", error);
                statusText.innerText = "Failed";
            }
        });

        async function sendCommand(cmd) {
            if (!txCharacteristic) return;
            try {
                let encoder = new TextEncoder();
                let data = encoder.encode(cmd + "#");
                
                if (txCharacteristic.properties.writeWithoutResponse) {
                    await txCharacteristic.writeValueWithoutResponse(data);
                } else if (txCharacteristic.properties.write) {
                    await txCharacteristic.writeValue(data);
                }
            } catch (error) {
                console.error("Send error details:", error);
            }
        }

        // --- MOUSE / TOUCH CONTROLS ---
        const buttons = document.querySelectorAll('.cmd-btn');
        buttons.forEach(btn => {
            const command = btn.getAttribute('data-cmd');

            btn.addEventListener('pointerdown', (e) => {
                btn.classList.add('active');
                sendCommand(command);
            });

            btn.addEventListener('pointerup', (e) => {
                btn.classList.remove('active');
                if (['F', 'B', 'L', 'R'].includes(command)) { sendCommand('S'); }
            });

            btn.addEventListener('pointerleave', (e) => {
                if(btn.classList.contains('active')) {
                    btn.classList.remove('active');
                    if (['F', 'B', 'L', 'R'].includes(command)) { sendCommand('S'); }
                }
            });
        });

        // --- BULLETPROOF KEYBOARD CONTROLS ---
        let currentlyPressedKey = null;

        document.addEventListener('keydown', function(e) {
            // Stop arrow keys from scrolling the webpage
            if([37, 38, 39, 40].indexOf(e.keyCode) > -1) {
                e.preventDefault();
            }

            if (e.repeat) return;
            
            let cmd = null;
            let btnClass = null;

            // MOVEMENT KEYS (WASD / Arrows)
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.keyCode === 38 || e.keyCode === 87) { 
                cmd = 'F'; btnClass = '.up'; 
            }
            else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.keyCode === 40 || e.keyCode === 83) { 
                cmd = 'B'; btnClass = '.down'; 
            }
            else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.keyCode === 37 || e.keyCode === 65) { 
                cmd = 'L'; btnClass = '.left'; 
            }
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.keyCode === 39 || e.keyCode === 68) { 
                cmd = 'R'; btnClass = '.right'; 
            }
            // NUMBER ACTION KEYS (1, 2, 3, 4)
            else if (e.key === '1' || e.keyCode === 49) { 
                cmd = '1'; btnClass = '.btn-1';
            }
            else if (e.key === '2' || e.keyCode === 50) { 
                cmd = '2'; btnClass = '.btn-2';
            }
            else if (e.key === '3' || e.keyCode === 51) { 
                cmd = '3'; btnClass = '.btn-3';
            }
            else if (e.key === '4' || e.keyCode === 52) { 
                cmd = '4'; btnClass = '.btn-4';
            }

            if (cmd && currentlyPressedKey !== cmd) {
                currentlyPressedKey = cmd;
                sendCommand(cmd);
                
                const btn = document.querySelector(btnClass);
                if (btn) btn.classList.add('active');
            }
        });

        document.addEventListener('keyup', function(e) {
            let isMovementKey = false;
            let isActionKey = false;
            let btnClass = null;

            // Check Movement
            if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W' || e.keyCode === 38 || e.keyCode === 87) { 
                isMovementKey = true; btnClass = '.up'; 
            }
            else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S' || e.keyCode === 40 || e.keyCode === 83) { 
                isMovementKey = true; btnClass = '.down'; 
            }
            else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A' || e.keyCode === 37 || e.keyCode === 65) { 
                isMovementKey = true; btnClass = '.left'; 
            }
            else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.keyCode === 39 || e.keyCode === 68) { 
                isMovementKey = true; btnClass = '.right'; 
            }
            // Check Actions
            else if (e.key === '1' || e.keyCode === 49) { 
                isActionKey = true; btnClass = '.btn-1'; 
            }
            else if (e.key === '2' || e.keyCode === 50) { 
                isActionKey = true; btnClass = '.btn-2'; 
            }
            else if (e.key === '3' || e.keyCode === 51) { 
                isActionKey = true; btnClass = '.btn-3'; 
            }
            else if (e.key === '4' || e.keyCode === 52) { 
                isActionKey = true; btnClass = '.btn-4'; 
            }

            if (isMovementKey) {
                currentlyPressedKey = null;
                sendCommand('S'); // Send Stop command when letting go of directions
                
                const btn = document.querySelector(btnClass);
                if (btn) btn.classList.remove('active');
            } 
            else if (isActionKey) {
                currentlyPressedKey = null;
                const btn = document.querySelector(btnClass);
                if (btn) btn.classList.remove('active');
            }
        });
        
        window.addEventListener('blur', function() {
            if (currentlyPressedKey) {
                sendCommand('S');
                currentlyPressedKey = null;
                document.querySelectorAll('.cmd-btn').forEach(b => b.classList.remove('active'));
            }
        });
    </script>
</body>
</html>
